[project]
name = "pyomo-summer-ws"
version = "0.1.0"
description = "Jupyter Book and notebook environment for the Pyomo Tutorial."
requires-python = ">=3.10,<3.13"
dependencies = []

[dependency-groups]
docs = [
    "ccxt>=4.5.70,<5",
    "graphviz>=0.20,<1",
    "jupyter-book==2.1.6",
    "jupyterlab>=4.6.2,<5",
    "openpyxl>=3.1,<4",
    "pandas>=2.0,<3",
    "pint>=0.24,<1",
    "pyomo>=6.10.1,<7",
]

[tool.uv]
package = false
default-groups = ["docs"]
constraint-dependencies = [
    "mistune>=3.3.0",
    "setuptools>=83.0.0",
    "soupsieve>=2.8.4",
]
