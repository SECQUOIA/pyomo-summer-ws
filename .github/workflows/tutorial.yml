name: deploy-book

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

jobs:
  build-book:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: 3.11

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.2.0

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: "24"

    - name: Install docs dependencies
      run: |
        uv sync --locked --group docs

    - name: Install GLPK and IPOPT
      id: solvers
      uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
      with:
        environment-name: solvers
        condarc: |
          channels:
            - conda-forge
        create-args: >-
          glpk=5.0
          ipopt=3.14
        init-shell: none
        cache-environment: true

    - name: Add solvers to PATH
      run: echo "$SOLVER_ENV/bin" >> "$GITHUB_PATH"
      env:
        SOLVER_ENV: ${{ steps.solvers.outputs.environment-path }}

    - name: Run content and solver tests
      run: |
        glpsol --version
        ipopt --version
        uv run --group docs python -m unittest discover -s tests -v
      env:
        REQUIRE_SOLVERS: "1"

    - name: Build the book
      run: |
        uv run --group docs jupyter book build --html --ci
      env:
        BASE_URL: /pyomo-summer-ws

    - name: Write legacy redirects
      run: |
        uv run --group docs python tools/write_legacy_redirects.py

    - name: Check generated URLs
      run: |
        if grep -R --line-number --fixed-strings "/pyomo-summer-ws//" _build/html; then
          echo "Generated site contains doubled project base URLs" >&2
          exit 1
        fi

    - name: Check generated static site
      run: |
        uv run --group docs python tools/check_static_site.py

    - name: Upload artifact
      if: github.event_name == 'push'
      uses: actions/upload-pages-artifact@v5
      with:
        path: "_build/html"

  deploy-book:
    if: github.event_name == 'push'
    needs: build-book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
