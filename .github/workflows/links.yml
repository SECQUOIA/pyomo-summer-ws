name: external-links

on:
  schedule:
  - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v6
    - name: Check external links
      run: python tools/check_external_links.py
